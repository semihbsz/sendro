[package]
name = "sendro-desktop"
version = "0.1.0"
description = "Sendro — private LAN file transfer for creators"
authors = ["Sendro"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "sendro_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
sendro-core = { path = "../../core" }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["serde", "v4"] }
anyhow = "1"
tokio = { version = "1", features = ["sync"] }
dirs = "6"
gethostname = "1"
log = "0.4"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
