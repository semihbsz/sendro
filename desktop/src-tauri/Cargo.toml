[package]
name = "sendro-desktop"
version = "1.0.0"
description = "Sendro — private LAN file transfer for creators"
authors = ["Sendro"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "sendro_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
sendro-core = { path = "../../core" }
# protocol-asset: the webview streams previews over asset:. The scope ships
# EMPTY (tauri.conf.json) and is only ever extended, one validated file at a
# time, by the `preview_file` command — see src/preview.rs.
tauri = { version = "2", features = ["tray-icon", "protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-autostart = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-notification = "2"
# In-app updates (UPDATES.md §3). Registered conditionally — see src/updates.rs.
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["serde", "v4"] }
anyhow = "1"
tokio = { version = "1", features = ["sync"] }
dirs = "6"
gethostname = "1"
log = "0.4"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
