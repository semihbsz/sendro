name: iOS Build

on:
  push:
    branches: [main]
    paths:
      - "ios/**"
      - ".github/workflows/ios-build.yml"
  workflow_dispatch:

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Build (Release, unsigned)
        working-directory: ios
        run: |
          xcodebuild \
            -project Sendro.xcodeproj \
            -scheme Sendro \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        working-directory: ios
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Sendro.app Payload/
          zip -ry Sendro-unsigned.ipa Payload
          ls -la Sendro-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sendro-unsigned.ipa
          path: ios/Sendro-unsigned.ipa
          retention-days: 14

      - name: Sideloading notice
        run: |
          echo "=============================================================="
          echo " Sendro-unsigned.ipa is NOT code-signed."
          echo " Sign it while sideloading from Windows, e.g. with Sideloadly"
          echo " or AltStore/AltServer — both re-sign the IPA with your own"
          echo " (free) Apple ID during install. The bundle id may be changed"
          echo " by the sideloading tool; that is expected and fine."
          echo "=============================================================="
