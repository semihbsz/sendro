name: Release

# One action, both platforms — docs/UPDATES.md §5.
#
#   1. edit release/release.json  (version + notes)
#   2. python3 scripts/bump_version.py
#   3. git commit && git tag v1.2.0 && git push --tags
#
# This run then builds the signed Windows bundle, builds the signed Android
# APK *if* android/ exists yet, generates latest.json + android.json from
# release/release.json, and publishes the GitHub Release with every asset.
#
# One-time setup (keys and secrets) is in docs/RELEASING.md.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # ---------------------------------------------------------------------
  # Gate: the tag, the manifests and the signing key must all agree before
  # a single minute of build time is spent.
  # ---------------------------------------------------------------------
  verify:
    name: Verify version and configuration
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      has_android: ${{ steps.android.outputs.present }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Every manifest matches release/release.json
        run: python3 scripts/bump_version.py --check

      - name: Read the release version
        id: release
        run: |
          version=$(jq -r .version release/release.json)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release/release.json says $version"

      - name: The tag matches the release version
        run: |
          tag="${GITHUB_REF_NAME}"
          expected="v${{ steps.release.outputs.version }}"
          if [ "$tag" != "$expected" ]; then
            echo "::error::tag $tag does not match release/release.json ($expected)."
            echo "Fix release/release.json (or the tag), re-run bump_version.py, and tag again."
            exit 1
          fi

      - name: The updater public key has been replaced
        run: |
          pubkey=$(jq -r '.plugins.updater.pubkey' desktop/src-tauri/tauri.conf.json)
          if [ -z "$pubkey" ] || [ "$pubkey" = "null" ] || [ "$pubkey" = "REPLACE_WITH_UPDATER_PUBLIC_KEY" ]; then
            echo "::error::plugins.updater.pubkey in desktop/src-tauri/tauri.conf.json is still the placeholder."
            echo "Run 'npm run tauri signer generate' once and follow docs/RELEASING.md step 2."
            exit 1
          fi

      - name: Is the Android app in the tree yet?
        id: android
        run: |
          if [ -f android/app/build.gradle.kts ] && [ -f android/gradlew ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "android/ found — the APK will be built and published."
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "android/ not present yet — this release is Windows-only."
          fi

  # ---------------------------------------------------------------------
  # Windows: the NSIS installer plus its minisign .sig, which is what
  # tauri-plugin-updater verifies before it installs anything.
  # ---------------------------------------------------------------------
  windows:
    name: Build signed Windows bundle
    needs: verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Core engine tests
        working-directory: core
        run: cargo test --all-targets

      - name: Install frontend dependencies
        working-directory: desktop
        run: npm ci || npm install

      - name: Build Tauri app (signed updater artifacts)
        working-directory: desktop
        shell: bash
        # `createUpdaterArtifacts` is false in the committed config on purpose:
        # it makes signing mandatory, and the push CI (windows-build.yml) has no
        # signing key. It is switched on here, where the key exists.
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY is not set. See docs/RELEASING.md step 3."
            exit 1
          fi
          # A file rather than inline JSON: npm on Windows mangles quoted
          # braces on their way to the CLI. The CLI deep-merges this into
          # tauri.conf.json, so nothing else in the bundle config is lost.
          # Written relative to desktop/ on purpose: a Windows $RUNNER_TEMP
          # path through git-bash is one more thing that can go wrong.
          printf '{"bundle":{"createUpdaterArtifacts":true}}' > updater-on.json
          npm run tauri build -- --config updater-on.json
          rm -f updater-on.json

      - name: Collect the installer and its signature
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.verify.outputs.version }}"
          src="desktop/src-tauri/target/release/bundle/nsis"
          mkdir -p out
          setup="$src/Sendro_${version}_x64-setup.exe"
          if [ ! -f "$setup" ]; then
            echo "::error::expected $setup — the bundler produced:"
            ls -la "$src" || true
            exit 1
          fi
          if [ ! -f "$setup.sig" ]; then
            echo "::error::$setup.sig is missing — the bundle was not signed."
            exit 1
          fi
          cp "$setup" "$setup.sig" out/
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: out/*
          retention-days: 7
          if-no-files-found: error

  # ---------------------------------------------------------------------
  # Android: only when the app exists. The APK must be signed with the same
  # keystore every time or Android refuses the update (UPDATES.md §4).
  # ---------------------------------------------------------------------
  android:
    name: Build signed Android APK
    needs: verify
    if: needs.verify.outputs.has_android == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore the release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set. See docs/RELEASING.md step 4."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/sendro-release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/sendro-release.jks" >> "$GITHUB_ENV"

      - name: Assemble release APK
        working-directory: android
        # The build script reads these four; docs/RELEASING.md §"Android
        # contract" spells out the exact names the Gradle config must use.
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Collect the APK
        run: |
          set -euo pipefail
          version="${{ needs.verify.outputs.version }}"
          apk=$(find android -path '*/outputs/apk/release/*.apk' -not -name '*unsigned*' | head -1)
          if [ -z "$apk" ]; then
            echo "::error::no release APK found under android/**/outputs/apk/release/"
            find android -name '*.apk' || true
            exit 1
          fi
          mkdir -p out
          cp "$apk" "out/Sendro-${version}.apk"
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: out/*
          retention-days: 7
          if-no-files-found: error

  # ---------------------------------------------------------------------
  # Publish: manifests are generated here, where the real .sig contents and
  # the real APK bytes are both on disk.
  # ---------------------------------------------------------------------
  publish:
    name: Publish the GitHub Release
    needs: [verify, windows, android]
    # `android` is skipped until the Android app lands; skipped is fine,
    # failed is not.
    if: >-
      always() &&
      needs.verify.result == 'success' &&
      needs.windows.result == 'success' &&
      needs.android.result != 'failure' &&
      needs.android.result != 'cancelled'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Show what we are about to publish
        run: ls -la dist

      - name: Generate latest.json and android.json
        run: |
          set -euo pipefail
          version="${{ needs.verify.outputs.version }}"
          args=(
            --repo "$GITHUB_REPOSITORY"
            --out dist
            --windows-setup "dist/Sendro_${version}_x64-setup.exe"
            --windows-signature "dist/Sendro_${version}_x64-setup.exe.sig"
          )
          if [ -f "dist/Sendro-${version}.apk" ]; then
            args+=(--apk "dist/Sendro-${version}.apk")
          fi
          python3 scripts/make_manifests.py "${args[@]}"
          echo "--- latest.json ---"
          cat dist/latest.json
          if [ -f dist/android.json ]; then
            echo "--- android.json ---"
            cat dist/android.json
          fi

      - name: List the assets to upload
        id: assets
        run: |
          set -euo pipefail
          version="${{ needs.verify.outputs.version }}"
          {
            echo "list<<EOF"
            echo "dist/latest.json"
            echo "dist/Sendro_${version}_x64-setup.exe"
            echo "dist/Sendro_${version}_x64-setup.exe.sig"
            # Only present once the Android app exists — see UPDATES.md §4.
            if [ -f "dist/android.json" ]; then echo "dist/android.json"; fi
            if [ -f "dist/Sendro-${version}.apk" ]; then echo "dist/Sendro-${version}.apk"; fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Compose the release body
        run: |
          set -euo pipefail
          {
            jq -r '.notes' release/release.json
            echo
            echo "**Türkçe:** $(jq -r '.notesTr // .notes' release/release.json)"
            echo
            echo "---"
            echo
            echo "- **Windows:** download \`Sendro_${{ needs.verify.outputs.version }}_x64-setup.exe\`. Existing installs update themselves from inside the app."
            if [ -f dist/android.json ]; then
              echo "- **Android:** download \`Sendro-${{ needs.verify.outputs.version }}.apk\` (sideload; allow \"install unknown apps\" once)."
            fi
            echo "- Transfers stay on your LAN. The only thing Sendro fetches from the internet is this release."
          } > release-body.md
          cat release-body.md

      - name: Create the release and upload every asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Sendro ${{ needs.verify.outputs.version }}
          body_path: release-body.md
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: ${{ steps.assets.outputs.list }}
