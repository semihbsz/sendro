[package]
name = "sendro-core"
version = "1.0.0"
edition = "2021"
rust-version = "1.80"
description = "Core engine for Sendro: private LAN file transfer (Windows PC <-> iPhone)"
license = "MIT"

[lib]
name = "sendro_core"
path = "src/lib.rs"

[dependencies]
tokio = { version = "1.40", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
axum = { version = "0.7", features = ["macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
sha2 = "0.10"
hmac = "0.12"
hkdf = "0.12"
subtle = "2"
rand = "0.8"
base64 = "0.22"
hex = "0.4"
mdns-sd = "0.13"
if-addrs = "0.13"
# The *client* half of the protocol (§4/§7/§11.2 against a peer host). Plain
# HTTP on the LAN — no TLS features, deliberately: PROTOCOL.md §3.
reqwest = { version = "0.12", default-features = false, features = ["json", "stream"] }
walkdir = "2"
mime_guess = "2"
percent-encoding = "2"
parking_lot = "0.12"
anyhow = "1"
tracing = "0.1"
futures = "0.3"

[dev-dependencies]
tempfile = "3"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream"] }
tokio = { version = "1.40", features = ["full", "test-util"] }
