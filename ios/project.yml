# XcodeGen project spec for the Sendro iOS app.
# Generated in CI (GitHub Actions, macOS runner) via `xcodegen generate`.
name: Sendro

options:
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "16.0"

settings:
  base:
    # Swift *language mode* (not toolchain version) — 5.0 is correct for
    # the Swift 5.9+ compiler on the CI runner.
    SWIFT_VERSION: "5.0"
    # URLSession delegates & Combine sinks are used from non-main queues on
    # purpose; keep concurrency checking minimal to match Swift 5 semantics.
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: "1.0.1"
    CURRENT_PROJECT_VERSION: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"

targets:
  Sendro:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Sendro
        excludes:
          - "Info.plist"
      # Shared with the SendroActivity extension — the ActivityAttributes
      # type has to be identical in both binaries. Plain shared source; no
      # App Group, no entitlement.
      - path: Shared
    dependencies:
      # Embeds SendroActivity.appex into Sendro.app/PlugIns.
      - target: SendroActivity
        embed: true
    settings:
      base:
        # NOTE: sideloaders (Sideloadly / AltStore) usually rewrite the bundle
        # id to match their free provisioning profile — change freely. If you
        # change it here, change SendroActivity's to match: an app extension's
        # bundle id MUST be prefixed by the containing app's.
        PRODUCT_BUNDLE_IDENTIFIER: com.sendro.ios
        PRODUCT_NAME: Sendro
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Sendro/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        ENABLE_BITCODE: NO
        CODE_SIGN_STYLE: Automatic

  # Live Activity host (Dynamic Island + Lock Screen).
  #
  # Deployment target 16.1 because ActivityConfiguration doesn't exist before
  # that; the app stays on 16.0 and gates every ActivityKit call behind
  # #available, so a 16.0 device just never sees a Live Activity.
  SendroActivity:
    type: app-extension
    platform: iOS
    deploymentTarget: "16.1"
    sources:
      - path: SendroActivity
        excludes:
          - "Info.plist"
      - path: Shared
      # Same palette/typography as the app, so the Island matches the UI.
      - path: Sendro/Views/Theme.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sendro.ios.SendroActivity
        PRODUCT_NAME: SendroActivity
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: SendroActivity/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        ENABLE_BITCODE: NO
        SKIP_INSTALL: YES
        CODE_SIGN_STYLE: Automatic

schemes:
  Sendro:
    build:
      targets:
        Sendro: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
